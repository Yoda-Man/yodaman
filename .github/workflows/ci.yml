name: CI

on:
  pull_request:
  push:
    # dev too, not just main. Work happens on dev and is merged to main once a
    # release is judged stable, so a main-only trigger meant every commit sat
    # untested until PR time — the branch where the work actually lives got no
    # CI at all.
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails outright when package.json and the lockfile disagree.
      # That is what silently broke this pipeline in August 2026: package.json
      # pinned jest@^30.4.3, a version that has never existed. Keep this step
      # first so a manifest/lockfile drift is the loudest possible failure.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # Production dependencies only: most dev-tree advisories (electron-builder
      # and friends) never reach a consumer of the published package and would
      # make this gate too noisy to keep enabled.
      #
      # The exception is anything scripts/sync-vendor.js copies into public/,
      # which ships in both the npm tarball and the desktop app despite being a
      # devDependency. This gate reported "0 vulnerabilities" for months while a
      # vulnerable vis-network bundle shipped to users. The step below closes
      # that hole; do not remove one without the other.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit vendored libraries that ship to users
        run: npm run audit:vendored

      - name: Build web app
        run: npm run build

      - name: Run release smoke checks
        run: npm run release:smoke

  # Non-blocking visibility on the full dependency tree, including dev.
  audit-dev:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=moderate
